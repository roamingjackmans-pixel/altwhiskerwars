# Gets each push to main ready for josephjackman.com/games/altwhiskerwars/.
# Moves the `ready` branch to that commit (there are no checks to run).
# The `games` repo (roamingjackmans-pixel/games) publishes every game on josephjackman.com/games/.
# It looks for new `ready` commits every 10 minutes, or hears right away when this repo has a
# GAMES_DEPLOY_TOKEN secret (a fine-grained token allowed to run Actions on the games repo).
name: Ready for the games site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ready
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.GAMES_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Mark this commit ready
        run: git push --force origin HEAD:refs/heads/ready
      - name: Tell the games site
        if: env.DEPLOY_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml -R roamingjackmans-pixel/games
